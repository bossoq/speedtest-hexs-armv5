name: build-and-push
on:
  workflow_dispatch:
    inputs:
      st_version:
        description: "Ookla speedtest CLI version"
        required: false
        default: "1.2.0"
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - .github/workflows/build.yml
  schedule:
    - cron: "23 5 * * 1"   # weekly safety-net rebuild (Mon 05:23 UTC)

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-push
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bossoq/speedtest-hexs-armv5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          ST="${{ github.event.inputs.st_version }}"
          if [ -z "$ST" ]; then
            # packagecloud Debian index carries the current Ookla CLI version, e.g. 1.2.0.84-1.<hash>
            FULL=$(curl -fsSL "https://packagecloud.io/ookla/speedtest-cli/debian/dists/bookworm/main/binary-amd64/Packages" \
                   | awk -F': ' '/^Version:/{print $2}' | sort -V | tail -1)
            ST=$(printf '%s' "$FULL" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')   # download URL uses the 3-part version
          fi
          [ -n "$ST" ] || { echo "could not resolve Ookla version"; exit 1; }
          echo "st=$ST" >> "$GITHUB_OUTPUT"
          echo "Resolved Ookla version: $ST (full: ${FULL:-$ST})"

      # No QEMU needed: the fetch stage is pinned to the amd64 builder and the
      # final arm/v5 stage has no RUN (COPY/ENV/ENTRYPOINT only). setup-qemu is
      # kept as cheap insurance for buildx.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (linux/arm/v5)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm/v5
          build-args: ST_VERSION=${{ steps.v.outputs.st }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.st }}
            ${{ env.IMAGE }}:latest
          provenance: false
          sbom: false
          push: true

      - name: Summary
        run: echo "Pushed \`$IMAGE:${{ steps.v.outputs.st }}\` and \`:latest\`" >> "$GITHUB_STEP_SUMMARY"
